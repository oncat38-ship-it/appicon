<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">PWA Shortcut Launcher</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 全画面表示メタタグ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0f172a; color: #f8fafc;
    }
    iframe {
      width: 100%; height: 100%; border: none; outline: none;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <script>
    // --- 1. パラメータの取得とPWA動的初期化 ---
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url');
    const titleParam = params.get('title') || 'Web App';
    const modeParam = params.get('mode') || 'iframe';
    
    let iconParam = sessionStorage.getItem('pwa_icon_data') || params.get('icon');

    if (targetUrl) {
      document.title = titleParam;

      if (iconParam) {
        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconParam;
        document.head.appendChild(appleIcon);
      }

      const manifest = {
        name: titleParam,
        short_name: titleParam,
        start_url: window.location.href,
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#0f172a",
        icons: [{
          src: iconParam || "https://via.placeholder.com/192/4f46e5/ffffff?text=APP",
          sizes: "192x192",
          type: "image/png"
        }]
      };
      const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(blob);
      document.head.appendChild(manifestLink);

      window.addEventListener('DOMContentLoaded', () => {
        if (modeParam === 'redirect') {
          window.location.href = targetUrl;
        } else {
          document.body.innerHTML = `
            <iframe src="${targetUrl}" allow="geolocation; microphone; camera; encrypted-media"></iframe>
          `;
        }
      });
    }
  </script>

  <!-- --- 2. 設定画面（初回アクセス時） --- -->
  <div id="generatorUI" class="max-w-xl mx-auto my-auto p-4 sm:p-6 w-full">
    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold flex items-center justify-center gap-2 text-indigo-400">
        <i data-lucide="smartphone"></i> PWA Shortcut Launcher
      </h1>
      <p class="text-slate-400 text-xs sm:text-sm mt-1">
        好きな名前・アイコンで、ブラウザ枠なしの専用ショートカットを作成します。
      </p>
    </header>

    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-4">
      
      <!-- リアルタイムプレビュー部 -->
      <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-4 flex items-center gap-4">
        <div class="flex flex-col items-center">
          <div id="previewIconBox" class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-3xl shadow-md overflow-hidden bg-cover bg-center">
            📱
          </div>
          <span class="text-[10px] text-slate-400 mt-1">アイコンプレビュー</span>
        </div>
        <div class="flex-1 min-w-0">
          <span class="text-xs text-indigo-300 font-semibold block">ホーム画面イメージ</span>
          <p id="previewTitleText" class="text-sm font-bold text-slate-100 truncate mt-0.5">マイアプリ</p>
          <p id="previewUrlText" class="text-[11px] text-slate-400 truncate mt-0.5">https://example.com</p>
        </div>
      </div>

      <!-- URL -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">1. 開きたい Web サイトの URL *</label>
        <input type="url" id="inputUrl" placeholder="https://example.com" value=""
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- アプリ名 -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">2. ホーム画面での表示名（アプリ名） *</label>
        <input type="text" id="inputTitle" placeholder="マイアプリ" value=""
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- アイコン設定 -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">3. アイコンの設定</label>
        
        <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-700 mb-3">
          <button type="button" class="tab-btn flex-1 py-1 text-xs rounded-md bg-indigo-600 text-white font-medium" data-type="file">📁 スマホの画像</button>
          <button type="button" class="tab-btn flex-1 py-1 text-xs rounded-md text-slate-400 font-medium" data-type="emoji">😀 絵文字 / 文字</button>
        </div>

        <!-- A: ファイル選択 -->
        <div id="iconTypeFile" class="icon-input-panel">
          <label class="flex items-center justify-center border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-lg p-3 cursor-pointer bg-slate-900/50 transition">
            <i data-lucide="image" class="w-5 h-5 text-slate-400 mr-2"></i>
            <span id="fileNameText" class="text-xs text-slate-300">スマホから画像を選択</span>
            <input type="file" id="inputFile" accept="image/*" class="hidden">
          </label>
        </div>

        <!-- B: 絵文字・一文字 -->
        <div id="iconTypeEmoji" class="icon-input-panel hidden">
          <div class="flex gap-2 items-center">
            <input type="text" id="inputEmoji" placeholder="🚀 や 🎯 など" maxLength="4"
              class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="color" id="inputBgColor" value="#4f46e5" class="w-10 h-9 rounded cursor-pointer border-0 bg-transparent">
          </div>
          <p class="text-[10px] text-slate-500 mt-1">※背景色もリアルタイムでプレビューに反映されます</p>
        </div>
      </div>

      <!-- 開き方 -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">4. 開き方</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-start gap-2 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700 cursor-pointer">
            <input type="radio" name="inputMode" value="iframe" checked class="mt-0.5 accent-indigo-500">
            <div>
              <span class="font-medium text-slate-200 block">枠なし全画面</span>
              <span class="text-[10px] text-slate-400">アドレスバーなしで単一アプリ風</span>
            </div>
          </label>
          <label class="flex items-start gap-2 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700 cursor-pointer">
            <input type="radio" name="inputMode" value="redirect" class="mt-0.5 accent-indigo-500">
            <div>
              <span class="font-medium text-slate-200 block">リダイレクト</span>
              <span class="text-[10px] text-slate-400">指定サイトへ直接ジャンプ</span>
            </div>
          </label>
        </div>
      </div>

      <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2">
        <i data-lucide="sparkles"></i> ショートカットを作成する
      </button>
    </div>

    <!-- 結果表示エリア -->
    <div id="resultBox" class="hidden mt-4 bg-slate-800 border border-indigo-500/50 rounded-2xl p-5 shadow-xl space-y-3">
      <h3 class="text-xs font-semibold text-indigo-300 flex items-center gap-1.5">
        <i data-lucide="check-circle-2"></i> 専用ページを作成しました
      </h3>

      <button id="openUrlBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 shadow-md">
        <i data-lucide="external-link" class="w-4 h-4"></i> 専用ページを開く
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const inputUrl = document.getElementById('inputUrl');
    const inputTitle = document.getElementById('inputTitle');
    const inputFile = document.getElementById('inputFile');
    const fileNameText = document.getElementById('fileNameText');
    const inputEmoji = document.getElementById('inputEmoji');
    const inputBgColor = document.getElementById('inputBgColor');
    
    // プレビュー要素
    const previewIconBox = document.getElementById('previewIconBox');
    const previewTitleText = document.getElementById('previewTitleText');
    const previewUrlText = document.getElementById('previewUrlText');

    const generateBtn = document.getElementById('generateBtn');
    const resultBox = document.getElementById('resultBox');
    const openUrlBtn = document.getElementById('openUrlBtn');

    let currentIconType = 'file';
    let uploadedBase64Icon = '';
    let generatedEmojiIcon = '';

    // 絵文字アイコン生成ロジック（右寄り対策としてX座標を左へ少しオフセット補正）
    function createEmojiIconDataUrl(symbol, bgColor) {
      const canvas = document.createElement('canvas');
      const size = 192;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = bgColor || '#4f46e5';
      ctx.fillRect(0, 0, size, size);

      const text = symbol || '📱';
      const charCount = [...text].length;
      let fontSize = 110;
      if (charCount === 2) fontSize = 85;
      if (charCount >= 3) fontSize = 65;

      ctx.fillStyle = '#ffffff';
      ctx.font = `${fontSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 【修正】絵文字フォントの右寄り特性を打ち消すため、X座標を少しだけ左（マイナス側）に補正 (-8px)
      const offsetX = -8;
      ctx.fillText(text, (size / 2) + offsetX, size / 2 + (fontSize * 0.05));

      return canvas.toDataURL('image/png');
    }

    // プレビューのリアルタイム更新関数
    function updatePreview() {
      const title = inputTitle.value.trim() || 'マイアプリ';
      const url = inputUrl.value.trim() || 'https://example.com';

      previewTitleText.textContent = title;
      previewUrlText.textContent = url;

      if (currentIconType === 'file' && uploadedBase64Icon) {
        previewIconBox.style.backgroundImage = `url(${uploadedBase64Icon})`;
        previewIconBox.textContent = '';
      } else {
        // 絵文字または未設定時
        previewIconBox.style.backgroundImage = 'none';
        const symbol = inputEmoji.value.trim() || title.charAt(0) || '📱';
        const bgColor = inputBgColor.value;
        
        generatedEmojiIcon = createEmojiIconDataUrl(symbol, bgColor);
        
        // プレビュー表示用
        previewIconBox.style.backgroundColor = bgColor;
        previewIconBox.textContent = symbol;
      }
    }

    // 入力イベントリスナーの登録
    inputUrl.addEventListener('input', updatePreview);
    inputTitle.addEventListener('input', updatePreview);
    inputEmoji.addEventListener('input', updatePreview);
    inputBgColor.addEventListener('input', updatePreview);

    // タブ切替
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('bg-indigo-600', 'text-white');
          b.classList.add('text-slate-400');
        });
        e.target.classList.remove('text-slate-400');
        e.target.classList.add('bg-indigo-600', 'text-white');

        currentIconType = e.target.getAttribute('data-type');
        document.querySelectorAll('.icon-input-panel').forEach(panel => panel.classList.add('hidden'));
        
        if (currentIconType === 'file') document.getElementById('iconTypeFile').classList.remove('hidden');
        if (currentIconType === 'emoji') document.getElementById('iconTypeEmoji').classList.remove('hidden');
        updatePreview();
      });
    });

    // 画像ファイル読み込み
    inputFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileNameText.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 192;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 192, 192);
            uploadedBase64Icon = canvas.toDataURL('image/png');
            updatePreview();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // 生成処理
    generateBtn.addEventListener('click', () => {
      const url = inputUrl.value.trim();
      const title = inputTitle.value.trim() || 'マイアプリ';
      const mode = document.querySelector('input[name="inputMode"]:checked').value;

      if (!url) {
        alert('開きたいサイトのURLを入力してください');
        return;
      }

      let finalIcon = '';
      if (currentIconType === 'file') {
        finalIcon = uploadedBase64Icon;
      } else if (currentIconType === 'emoji') {
        const symbol = inputEmoji.value.trim() || title.charAt(0);
        finalIcon = createEmojiIconDataUrl(symbol, inputBgColor.value);
      }

      if (finalIcon) {
        sessionStorage.setItem('pwa_icon_data', finalIcon);
      }

      const baseUrl = window.location.origin + window.location.pathname;
      const finalUrl = new URL(baseUrl);
      finalUrl.searchParams.set('url', url);
      finalUrl.searchParams.set('title', title);
      finalUrl.searchParams.set('mode', mode);

      resultBox.classList.remove('hidden');

      openUrlBtn.onclick = () => {
        window.location.href = finalUrl.toString();
      };
    });

    // 初期化時プレビュー実行
    updatePreview();
  </script>
</body>
</html>
